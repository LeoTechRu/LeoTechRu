name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (syntax/undefined baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      # Narrow baseline: real bugs only (syntax errors + undefined names),
      # so it stays green on this large polyglot monorepo while still
      # catching breakage. Widen the rule set as the codebase is cleaned up.
      - run: ruff check --select E9,F63,F7,F82 --output-format=github .

  requirements:
    name: Root requirements install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Verifies the root requirements actually resolve into a clean venv
      # (the previous system pip-freeze did not).
      - run: pip install -r requirements.txt

  platform-contracts:
    name: Platform contract conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install conformance dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "jsonschema==4.20.0" "rfc3987==1.3.8" "PyYAML==6.0.2"
      - name: Check workflow regression
        run: python -m unittest codex.tests.test_ci_workflow -v
      - name: Check deterministic platform conformance
        shell: bash
        run: |
          set -euo pipefail
          validator="contracts/platform/v1/conformance/validate-terminal-dependencies.py"
          git ls-files --error-unmatch "$validator" >/dev/null
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python "$validator" > "$tmpdir/first.txt"
          python "$validator" > "$tmpdir/second.txt"
          cmp -- "$tmpdir/first.txt" "$tmpdir/second.txt"
          cat "$tmpdir/first.txt"
