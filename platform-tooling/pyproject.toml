[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "intdata-platform-tooling"
version = "0.1.0"
description = "Offline validation and canonicalization for intData platform contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "third_party/rfc8785/LICENSE", "third_party/jsonschema/COPYING"]
authors = [{name = "intData contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "jsonschema==4.25.1",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
intdata-tools = "intdata_tooling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
