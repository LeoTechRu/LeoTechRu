[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unisender-mcp"
version = "0.1.0"
description = "Guarded Unisender MCP for Punkt B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "mcp>=1.0"]

[project.scripts]
unisender-mcp = "unisender_mcp.server:main"

[tool.setuptools.packages.find]
include = ["unisender_mcp*"]
